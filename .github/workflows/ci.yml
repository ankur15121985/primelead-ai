# ═══════════════════════════════════════════════════════════════════════
# PRIMELEAD AI — CI/CD Pipeline
# Runs on every push to main and on pull requests
# ═══════════════════════════════════════════════════════════════════════

name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'
  WORKING_DIRECTORY: Compute

jobs:
  # ── Job 1: Lint & Typecheck ──────────────────────────────────
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            Compute/server/package-lock.json
            Compute/client/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm install --legacy-peer-deps

      - name: TypeScript check (server)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run typecheck -w server

      - name: TypeScript check (client)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run typecheck -w client

  # ── Job 2: Unit Tests ───────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            Compute/server/package-lock.json
            Compute/client/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm install --legacy-peer-deps

      - name: Setup database
        working-directory: ${{ env.WORKING_DIRECTORY }}/server
        run: npx prisma generate && npx prisma db push --skip-generate

      - name: Run tests
        working-directory: ${{ env.WORKING_DIRECTORY }}/server
        run: npx vitest run --reporter=verbose 2>&1 | tail -30
        env:
          DATABASE_URL: "file:./test.db"

  # ── Job 3: Build ────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            Compute/server/package-lock.json
            Compute/client/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm install --legacy-peer-deps

      - name: Build server
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run build -w server

      - name: Build client
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run build -w client

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: |
            Compute/server/dist
            Compute/client/dist
          retention-days: 7

  # ── Job 4: E2E Tests ───────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            Compute/server/package-lock.json
            Compute/client/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm install --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npx playwright install --with-deps chromium

      - name: Setup database
        working-directory: ${{ env.WORKING_DIRECTORY }}/server
        run: npx prisma generate && npx prisma db push --skip-generate

      - name: Run E2E tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npx playwright test --reporter=list 2>&1 | tail -30
        env:
          DATABASE_URL: "file:./test.db"
          PORT: 3001

  # ── Job 5: Docker Build ─────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [check, test, build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
        if: ${{ secrets.DOCKER_USERNAME != '' }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Compute/Dockerfile
          push: false
          tags: primelead:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: |
          docker build -t primelead:${{ github.sha }} -f Compute/Dockerfile .
          docker save primelead:${{ github.sha }} | gzip > primelead-image.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-${{ github.sha }}
          path: primelead-image.tar.gz
          retention-days: 3

  # ── Job 6: Deploy ───────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [check, test, build, e2e, docker]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    concurrency: deploy-production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: Compute/server/dist

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh deploy@${{ secrets.DEPLOY_HOST }} << 'DEPLOY_EOF'
            cd /opt/primelead

            # Pull latest code
            git pull origin main

            # Copy build artifacts
            cp -r /tmp/build/server/dist server/dist

            # Install production dependencies
            cd server && npm ci --omit=dev && cd ..

            # Run migrations
            cd server && npx prisma migrate deploy && cd ..

            # Restart services
            docker compose -f docker-compose.prod.yml restart api

            # Wait for health check
            sleep 10
            curl -sf http://localhost:3001/api/health || echo "Health check failed"

            echo "Deploy complete at $(date)"
          DEPLOY_EOF

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Deployed to production successfully!"
          echo "   Commit: ${{ github.sha }}"
          echo "   Time: $(date)"
